name: Fix MHTML Content-Location

on:
  push:
    paths:
      - .github/workflows/fix-mhtml-content-location.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch read_html_or_mhtml
        env:
          GZ_FUNCTION: 
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,re,base64,gzip
          p=Path('scripts/linkedin_worker_unified.py')
          s=p.read_text(encoding='utf-8')
          new=gzip.decompress(base64.b64decode(os.environ['GZ_FUNCTION'])).decode('utf-8')
          a=s.index('def read_html_or_mhtml(')
          m=re.search(r'\ndef [A-Za-z_][A-Za-z0-9_]*\(', s[a+1:])
          if not m:
              raise RuntimeError('next function not found')
          b=a+1+m.start()+1
          s=s[:a]+new+s[b:]
          compile(s,str(p),'exec')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/linkedin_worker_unified.py
          git commit -m 'Fix LinkedIn MHTML main document selection'
          git push
