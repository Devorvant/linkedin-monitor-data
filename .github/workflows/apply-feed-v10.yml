name: Apply Feed v10 patch

on:
  push:
    paths:
      - .github/workflows/apply-feed-v10.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch worker
        env:
          GZ_DECODE: 
          GZ_READ: 
          GZ_EXTRACT: 
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,re,base64,gzip
          p=Path('scripts/linkedin_worker_unified.py')
          s=p.read_text(encoding='utf-8')
          def repl(src,name,payload):
              new=gzip.decompress(base64.b64decode(payload)).decode('utf-8')
              a=src.index('def '+name+'(')
              m=re.search(r'\ndef [A-Za-z_][A-Za-z0-9_]*\(', src[a+1:])
              if not m:
                  raise RuntimeError('next def not found for '+name)
              b=a+1+m.start()+1
              return src[:a]+new+src[b:]
          s=repl(s,'decode_html_bytes',os.environ['GZ_DECODE'])
          s=repl(s,'read_html_or_mhtml',os.environ['GZ_READ'])
          s=repl(s,'extract_records',os.environ['GZ_EXTRACT'])
          compile(s,str(p),'exec')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patched worker
        run: |
          if git diff --quiet -- scripts/linkedin_worker_unified.py; then
            echo 'Worker already patched'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/linkedin_worker_unified.py
          git commit -m 'Update LinkedIn Feed parser to v10'
          git push
