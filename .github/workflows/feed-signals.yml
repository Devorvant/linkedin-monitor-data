name: Build Feed Signals

on:
  push:
    paths:
      - feed_latest.json
      - profile.json
      - scripts/feed_signal_analyzer.py.gz.b64
      - scripts/action_planner.py
      - scripts/relationship_watchlist.py
      - '.feed-signals-trigger*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate pipeline scripts
        run: |
          python -m py_compile scripts/action_planner.py scripts/relationship_watchlist.py

      - name: Unpack analyzer
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip
          src = Path('scripts/feed_signal_analyzer.py.gz.b64').read_text(encoding='utf-8').strip()
          data = gzip.decompress(base64.b64decode(src))
          Path('scripts/feed_signal_analyzer.py').write_bytes(data)
          compile(data.decode('utf-8'), 'scripts/feed_signal_analyzer.py', 'exec')
          PY

      - name: Analyze Feed
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo 'OpenAI key detected: using gpt-5.6-luna for medium/high signals'
            python scripts/feed_signal_analyzer.py \
              --feed feed_latest.json \
              --profile profile.json \
              --output feed_signals_latest.json \
              --provider openai \
              --model gpt-5.6-luna \
              --llm-scope medium-high
          else
            echo 'OPENAI_API_KEY is not configured: using rules-only fallback'
            python scripts/feed_signal_analyzer.py \
              --feed feed_latest.json \
              --profile profile.json \
              --output feed_signals_latest.json \
              --provider none \
              --llm-scope none
          fi

      - name: Update relationship CRM
        run: |
          python scripts/relationship_watchlist.py \
            --signals feed_signals_latest.json \
            --watchlist relationship_watchlist.json

      - name: Build CRM-aware action queue
        run: |
          python scripts/action_planner.py \
            --signals feed_signals_latest.json \
            --crm relationship_watchlist.json \
            --output action_queue_latest.json

      - name: Save daily history
        run: |
          mkdir -p history/feed_signals history/action_queue history/relationships
          cp feed_signals_latest.json "history/feed_signals/$(date -u +%F).json"
          cp action_queue_latest.json "history/action_queue/$(date -u +%F).json"
          cp relationship_watchlist.json "history/relationships/$(date -u +%F).json"

      - name: Build pipeline status
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          signals = json.loads(Path('feed_signals_latest.json').read_text(encoding='utf-8'))
          actions = json.loads(Path('action_queue_latest.json').read_text(encoding='utf-8'))
          crm = json.loads(Path('relationship_watchlist.json').read_text(encoding='utf-8'))
          status = {
              'schema_version': 1,
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'status': 'OK',
              'feed_signals': signals.get('summary', {}),
              'action_queue': actions.get('summary', {}),
              'relationships': crm.get('summary', {}),
              'llm_provider': 'openai' if any((s.get('llm') or {}).get('used') for s in signals.get('signals', [])) else 'rules-only',
          }
          Path('feed_pipeline_status.json').write_text(json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feed_signals_latest.json action_queue_latest.json relationship_watchlist.json feed_pipeline_status.json history/feed_signals history/action_queue history/relationships
          if git diff --cached --quiet; then
            echo 'No Feed analysis changes'
            exit 0
          fi
          git commit -m "Update Feed CRM pipeline $(date -u +%F)"

          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; rebasing onto latest origin/main..."
            git fetch origin main
            git rebase origin/main
          done

          echo 'Failed to push Feed CRM outputs after 3 attempts.'
          exit 1
