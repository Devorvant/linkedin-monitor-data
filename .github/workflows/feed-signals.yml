name: Build Feed Signals

on:
  push:
    paths:
      - feed_latest.json
      - profile.json
      - scripts/feed_signal_analyzer.py.gz.b64
      - scripts/action_planner.py
      - scripts/relationship_watchlist.py
      - '.feed-signals-trigger*'
  workflow_dispatch:
    inputs:
      analysis_mode:
        description: 'Feed analysis mode: auto detects whether Luna is needed; reuse skips Luna; llm forces Luna'
        required: true
        default: auto
        type: choice
        options:
          - auto
          - reuse
          - llm

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate pipeline scripts
        run: |
          python -m py_compile scripts/action_planner.py scripts/relationship_watchlist.py

      - name: Unpack analyzer
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip
          src = Path('scripts/feed_signal_analyzer.py.gz.b64').read_text(encoding='utf-8').strip()
          data = gzip.decompress(base64.b64decode(src))
          Path('scripts/feed_signal_analyzer.py').write_bytes(data)
          compile(data.decode('utf-8'), 'scripts/feed_signal_analyzer.py', 'exec')
          PY

      - name: Decide Feed analysis mode
        id: mode
        shell: bash
        run: |
          requested='${{ github.event.inputs.analysis_mode }}'
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ] && [ -n "$requested" ] && [ "$requested" != 'auto' ]; then
            mode="$requested"
            reason="manual workflow_dispatch: $requested"
          elif [ ! -f feed_signals_latest.json ]; then
            mode='llm'
            reason='feed_signals_latest.json is missing'
          elif [ "${{ github.event_name }}" = 'push' ]; then
            before='${{ github.event.before }}'
            after='${{ github.sha }}'
            changed="$(git diff --name-only "$before" "$after" 2>/dev/null || git diff --name-only HEAD^ HEAD)"
            echo 'Changed files:'
            echo "$changed"
            if echo "$changed" | grep -Eq '^(feed_latest\.json|profile\.json|scripts/feed_signal_analyzer\.py\.gz\.b64)$'; then
              mode='llm'
              reason='Feed/profile/analyzer changed'
            else
              mode='reuse'
              reason='Only downstream/test files changed'
            fi
          else
            mode='llm'
            reason='auto manual run defaults to fresh analysis'
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "Feed analysis mode: $mode ($reason)"

      - name: Analyze Feed with Luna when needed
        if: steps.mode.outputs.mode == 'llm'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo 'OpenAI key detected: using gpt-5.6-luna for medium/high signals'
            python scripts/feed_signal_analyzer.py \
              --feed feed_latest.json \
              --profile profile.json \
              --output feed_signals_latest.json \
              --provider openai \
              --model gpt-5.6-luna \
              --llm-scope medium-high
          else
            echo 'OPENAI_API_KEY is not configured: using rules-only fallback'
            python scripts/feed_signal_analyzer.py \
              --feed feed_latest.json \
              --profile profile.json \
              --output feed_signals_latest.json \
              --provider none \
              --llm-scope none
          fi

      - name: Reuse existing Feed analysis
        if: steps.mode.outputs.mode == 'reuse'
        run: |
          test -s feed_signals_latest.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('feed_signals_latest.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          print(f"TEST/REUSE mode: Luna skipped; reusing {p} with {len(data.get('signals', []))} signals")
          PY

      - name: Update relationship CRM
        run: |
          python scripts/relationship_watchlist.py \
            --signals feed_signals_latest.json \
            --watchlist relationship_watchlist.json

      - name: Build CRM-aware action queue
        run: |
          python scripts/action_planner.py \
            --signals feed_signals_latest.json \
            --crm relationship_watchlist.json \
            --output action_queue_latest.json

      - name: Save daily history
        run: |
          mkdir -p history/feed_signals history/action_queue history/relationships
          cp feed_signals_latest.json "history/feed_signals/$(date -u +%F).json"
          cp action_queue_latest.json "history/action_queue/$(date -u +%F).json"
          cp relationship_watchlist.json "history/relationships/$(date -u +%F).json"

      - name: Build pipeline status
        env:
          ANALYSIS_MODE: ${{ steps.mode.outputs.mode }}
          ANALYSIS_REASON: ${{ steps.mode.outputs.reason }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          signals = json.loads(Path('feed_signals_latest.json').read_text(encoding='utf-8'))
          actions = json.loads(Path('action_queue_latest.json').read_text(encoding='utf-8'))
          crm = json.loads(Path('relationship_watchlist.json').read_text(encoding='utf-8'))
          status = {
              'schema_version': 2,
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'status': 'OK',
              'analysis_mode': os.environ.get('ANALYSIS_MODE', 'unknown'),
              'analysis_reason': os.environ.get('ANALYSIS_REASON', ''),
              'feed_signals': signals.get('summary', {}),
              'action_queue': actions.get('summary', {}),
              'relationships': crm.get('summary', {}),
              'llm_provider': 'openai' if any((s.get('llm') or {}).get('used') for s in signals.get('signals', [])) else 'rules-only',
          }
          Path('feed_pipeline_status.json').write_text(json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feed_signals_latest.json action_queue_latest.json relationship_watchlist.json feed_pipeline_status.json history/feed_signals history/action_queue history/relationships
          if git diff --cached --quiet; then
            echo 'No Feed pipeline changes'
            exit 0
          fi
          git commit -m "Update Feed CRM pipeline $(date -u +%F)"

          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; rebasing onto latest origin/main..."
            git fetch origin main
            git rebase origin/main
          done

          echo 'Failed to push Feed CRM outputs after 3 attempts.'
          exit 1
