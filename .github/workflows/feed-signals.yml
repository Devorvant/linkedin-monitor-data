name: Build Feed Signals

on:
  push:
    paths:
      - feed_latest.json
      - profile.json
      - scripts/feed_signal_analyzer.py.gz.b64
      - .feed-signals-trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unpack analyzer
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip
          src = Path('scripts/feed_signal_analyzer.py.gz.b64').read_text(encoding='utf-8').strip()
          data = gzip.decompress(base64.b64decode(src))
          Path('scripts/feed_signal_analyzer.py').write_bytes(data)
          compile(data.decode('utf-8'), 'scripts/feed_signal_analyzer.py', 'exec')
          PY
      - name: Analyze Feed
        run: |
          python scripts/feed_signal_analyzer.py \
            --feed feed_latest.json \
            --profile profile.json \
            --output feed_signals_latest.json \
            --provider none \
            --llm-scope none
      - name: Save daily history
        run: |
          mkdir -p history/feed_signals
          cp feed_signals_latest.json "history/feed_signals/$(date -u +%F).json"
      - name: Commit outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feed_signals_latest.json history/feed_signals
          if git diff --cached --quiet; then
            echo 'No signal changes'
            exit 0
          fi
          git commit -m "Update Feed signals $(date -u +%F)"
          git push
